site_name: CyberHub Documentation
site_description: Documentation for the CyberHub, a cybersecurity training platform.
site_url: https://docs.saguaroscyberhub.org

repo_url: https://github.com/Saguaros-CyberHub/CyberHub-Docs
edit_uri: edit/main/docs

### Build settings ###

theme: readthedocs

markdown_extensions:
  - admonition

plugins:
  # Declaring `plugins` replaces the defaults, so `search` must be listed
  # explicitly to keep site search working.
  - search
  - mermaid2